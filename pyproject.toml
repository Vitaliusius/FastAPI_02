[project]
name = "fastai"
version = "0.1.0"
description = "AI website generator."
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "aioboto3>=15.5.0",
    "editorconfig-checker==3.2.1",
    "fastapi[standard]==0.115.12",
    "gotenberg-api",
    "html-page-generator",
    "pre-commit>=4.3.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.11.7",
    "ruff==0.11.13",
]

[dependency-groups]
dev = [
    "editorconfig-checker>=3.2.1",
]

[tool.uv.sources]
gotenberg-api = { git = "https://github.com/devmanorg/gotenberg-api.git" }
html-page-generator = { git = "https://github.com/devmanorg/html-page-generator.git" }
