            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .header {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            animation: fadeIn 2s;
        }
        h2 {
            font-size: 2em;
            color: #8B4513;
            animation: fadeIn 2s 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .content {
            padding: 20px;
            text-align: center;
        }
        .images {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .image {
            margin: 10px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .image img {
            width: 300px;
            height: auto;
            transition: transform 0.3s;
        }
        .image img:hover {
            transform: scale(1.05);
        }
        footer {
            background-color: #8B4513;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
