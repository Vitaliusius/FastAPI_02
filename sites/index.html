<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автосервис Онлайн Запись</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        header {
            position: relative;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1640616111573-276dd3e31666?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMDM4MjQ2fDB8MXxzZWFyY2h8MXx8JUQwJUIwJUQwJUIyJUQxJTgyJUQwJUJFJUQxJTgxJUQwJUI1JUQxJTgwJUQwJUIyJUQwJUI4JUQxJTgxJTJDJUQxJTgxJUQwJUIwJUQwJUI5JUQxJTgyLSVEMCVCMiVEMCVCOCVEMCVCNyVEMCVCOCVEMSU4MiVEMCVCQSVEMCVCMCUyQyVEMCVCRiVEMSU4MCVEMCVCMCVEMCVCOSVEMSU4MS0lRDAlQkIlRDAlQjglRDElODElRDElODIlMkMlRDAlQjclRDAlQjAlRDAlQkYlRDAlQjglRDElODElRDElOEMlMkMlRDAlQkUlRDAlQkQlRDAlQkIlRDAlQjAlRDAlQjklRDAlQkR8ZW58MHx8fHwxNzg3NDA3NzkwfDA&ixlib=rb-4.1.0&q=80&w=1080');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 4em;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .content {
            padding: 20px;
        }
        .price-list, .appointment-form {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Добро пожаловать в Автосервис</h1>
    </header>
    <div class="content">
        <section class="price-list">
            <h2>Прайс-лист</h2>
            <ul>
                <li>Замена масла - 1000 руб.</li>
                <li>Техническое обслуживание - 2500 руб.</li>
                <li>Диагностика двигателя - 1500 руб.</li>
            </ul>
        </section>
        <section class="appointment-form">
            <h2>Запись на прием</h2>
            <form>
                <label for="name">Ваше имя:</label><br>
                <input type="text" id="name" name="name" required><br><br>
                <label for="phone">Ваш телефон:</label><br>
                <input type="tel" id="phone" name="phone" required><br><br>
                <input type="submit" value="Записаться">
            </form>
        </section>
    </div>
    <footer>
        <p>© 2026 Автосервис Онлайн Запись</p>
    </footer>
</body>
</html>
