fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.2.0
    hooks:
      - id: editorconfig-checker

  - repo: local
    hooks:
      - id: linters-ruff
        name: ruff
        entry: uv run ruff check ./src
        language: system
        pass_filenames: no